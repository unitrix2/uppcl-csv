<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSV Splitter for UPPCL</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root { --bg: #0b0e14; --card: #161b22; --accent: #58a6ff; --text: #c9d1d9; --border: #30363d; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg); color: var(--text); display: flex; justify-content: center; padding: 20px; }
        .container { background: var(--card); padding: 30px; border-radius: 16px; border: 1px solid var(--border); width: 100%; max-width: 800px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
        .header { text-align: center; margin-bottom: 25px; }
        .author-badge { display: inline-block; padding: 4px 12px; border: 1px solid var(--accent); color: var(--accent); border-radius: 20px; font-family: 'JetBrains Mono'; font-size: 0.75rem; margin-top: 8px; }
        
        .drop-zone { border: 2px dashed #30363d; border-radius: 12px; padding: 40px; text-align: center; cursor: pointer; background: rgba(255,255,255,0.02); transition: 0.3s; margin-bottom: 20px; }
        .drop-zone:hover { border-color: var(--accent); background: rgba(88, 166, 255, 0.05); }
        
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .stat-card { background: #0d1117; padding: 15px; border-radius: 10px; border: 1px solid var(--border); text-align: center; }
        .stat-card small { color: #8b949e; font-size: 0.7rem; text-transform: uppercase; }
        .stat-card div { font-size: 1.1rem; font-weight: 600; color: var(--accent); }

        .control-group { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px; }
        input, select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border); background: #0d1117; color: white; box-sizing: border-box; }
        
        button { width: 100%; padding: 15px; border-radius: 10px; border: none; font-weight: 600; cursor: pointer; background: var(--accent); color: white; transition: 0.2s; }
        button:hover { filter: brightness(1.1); transform: translateY(-2px); }

        #progress-area { display: none; margin-top: 30px; }
        .progress-bar { width: 100%; height: 8px; background: #30363d; border-radius: 10px; overflow: hidden; margin: 15px 0; }
        .progress-fill { width: 0%; height: 100%; background: var(--accent); transition: 0.1s; }

        .details-table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 0.85rem; }
        th, td { padding: 12px; border: 1px solid var(--border); text-align: left; }
        th { background: #1f242c; color: #8b949e; }
        .success-text { color: #39d353; font-weight: bold; }
        
        #download-btn { display: none; text-align: center; margin-top: 20px; padding: 15px; background: #238636; color: white; text-decoration: none; border-radius: 10px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1 style="margin:0;">⚡CSV Splitter for UPPCL</h1>
        <div class="author-badge">Created by: Salman</div>
    </div>

    <div class="drop-zone" onclick="document.getElementById('fileInput').click()">
        <p id="file-label">Browse or Drag CSV File Here</p>
        <input type="file" id="fileInput" accept=".csv" style="display:none" onchange="initAnalysis()">
    </div>

    <div id="inputStats" class="stats-grid" style="display:none">
        <div class="stat-card"><small>Input Name</small><div id="in-name" style="font-size:0.8rem">-</div></div>
        <div class="stat-card"><small>Total Rows</small><div id="in-rows">0</div></div>
        <div class="stat-card"><small>File Size</small><div id="in-size">0 MB</div></div>
    </div>

    <div class="control-group">
        <div><label style="font-size:0.8rem">Split By</label>
            <select id="splitMode"><option value="rows">Rows Per File</option><option value="parts">Total Parts</option></select>
        </div>
        <div><label style="font-size:0.8rem">Value</label>
            <input type="number" id="splitValue" value="999999">
        </div>
    </div>

    <button onclick="processData()">Start Micro-Splitting</button>

    <div id="progress-area">
        <div style="display:flex; justify-content:space-between; font-size:0.85rem">
            <span id="status-msg">Processing...</span>
            <span id="percent-msg">0%</span>
        </div>
        <div class="progress-bar"><div id="bar" class="progress-fill"></div></div>
        
        <table class="details-table">
            <thead><tr><th>Output Part</th><th>Rows</th><th>Status</th></tr></thead>
            <tbody id="details-body"></tbody>
        </table>

        <a id="download-btn">📥 DOWNLOAD ALL PARTS (ZIP)</a>
    </div>
</div>

<script>
    let selectedFile = null;
    let totalLines = 0;
    let headerRow = "";

    function initAnalysis() {
        selectedFile = document.getElementById('fileInput').files[0];
        if(!selectedFile) return;

        document.getElementById('file-label').innerText = selectedFile.name;
        document.getElementById('in-name').innerText = selectedFile.name;
        document.getElementById('in-size').innerText = (selectedFile.size / (1024*1024)).toFixed(2) + " MB";
        
        // Fast counting without loading in memory
        let count = 0;
        Papa.parse(selectedFile, {
            worker: true,
            step: (results) => { if(results.data[0] !== "") count++; },
            complete: () => {
                totalLines = count - 1;
                document.getElementById('in-rows').innerText = totalLines.toLocaleString();
                document.getElementById('inputStats').style.display = 'grid';
            }
        });
    }

    async function processData() {
        if(!selectedFile) return alert("Please select a file!");

        const mode = document.getElementById('splitMode').value;
        const val = parseInt(document.getElementById('splitValue').value);
        const chunkSize = mode === 'rows' ? val : Math.ceil(totalLines / val);

        document.getElementById('progress-area').style.display = 'block';
        document.getElementById('details-body').innerHTML = "";
        document.getElementById('download-btn').style.display = 'none';

        const zip = new JSZip();
        let currentChunk = [];
        let partNumber = 1;
        let processedLines = 0;

        Papa.parse(selectedFile, {
            worker: true,
            header: false,
            skipEmptyLines: true,
            chunk: (results) => {
                if(!headerRow) {
                    headerRow = results.data[0].join(",");
                    results.data.shift();
                }

                for(let row of results.data) {
                    currentChunk.push(row.join(","));
                    processedLines++;

                    if(currentChunk.length >= chunkSize) {
                        savePart(zip, currentChunk, partNumber, headerRow);
                        updateTable(partNumber, currentChunk.length);
                        currentChunk = [];
                        partNumber++;
                    }
                    
                    if(processedLines % 10000 === 0) {
                        let p = Math.min(100, (processedLines / totalLines) * 100);
                        document.getElementById('bar').style.width = p + "%";
                        document.getElementById('percent-msg').innerText = Math.round(p) + "%";
                    }
                }
            },
            complete: async () => {
                if(currentChunk.length > 0) {
                    savePart(zip, currentChunk, partNumber, headerRow);
                    updateTable(partNumber, currentChunk.length);
                }

                document.getElementById('status-msg').innerText = "Finalizing ZIP file...";
                const content = await zip.generateAsync({type:"blob"});
                const dl = document.getElementById('download-btn');
                dl.href = URL.createObjectURL(content);
                dl.download = `Split_Result_${selectedFile.name.replace('.csv','')}.zip`;
                dl.style.display = 'block';
                document.getElementById('status-msg').innerText = "Process Complete!";
                document.getElementById('bar').style.width = "100%";
                document.getElementById('percent-msg').innerText = "100%";
            }
        });
    }

    function savePart(zip, data, num, header) {
        const content = header + "\n" + data.join("\n");
        zip.file(`Part_${num}.csv`, content);
    }

    function updateTable(num, rows) {
        const body = document.getElementById('details-body');
        const row = body.insertRow();
        row.innerHTML = `<td>Part_${num}.csv</td><td>${rows.toLocaleString()}</td><td class="success-text">Success</td>`;
    }
</script>

</body>
</html>
