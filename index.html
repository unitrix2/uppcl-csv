<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro CSV Splitter - ABC</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --accent: #38bdf8; --text: #f1f5f9; --border: #334155; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg); color: var(--text); display: flex; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; }
        .container { background: var(--card); padding: 35px; border-radius: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); width: 100%; max-width: 750px; border: 1px solid var(--border); }
        .header { text-align: center; margin-bottom: 25px; }
        h1 { margin: 0; font-size: 2rem; background: linear-gradient(90deg, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .author-chip { display: inline-block; background: rgba(56, 189, 248, 0.1); border: 1px solid var(--accent); color: var(--accent); padding: 5px 18px; border-radius: 50px; font-family: 'JetBrains Mono'; font-size: 0.8rem; margin-top: 10px; box-shadow: 0 0 15px rgba(56, 189, 248, 0.2); }
        
        /* Modern Upload Zone */
        .drop-zone { border: 2px dashed #475569; border-radius: 16px; padding: 40px; text-align: center; cursor: pointer; transition: 0.3s; background: rgba(255,255,255,0.02); margin-bottom: 25px; }
        .drop-zone:hover { border-color: var(--accent); background: rgba(56, 189, 248, 0.05); }
        
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; display: none; }
        .stat-card { background: #0f172a; padding: 15px; border-radius: 12px; border: 1px solid var(--border); text-align: center; }
        .stat-card label { display: block; font-size: 0.7rem; color: #64748b; text-transform: uppercase; margin-bottom: 5px; }
        .stat-card span { font-size: 1.1rem; font-weight: 600; color: var(--accent); }

        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px; }
        select, input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: #0f172a; color: white; outline: none; transition: 0.2s; }
        select:focus, input:focus { border-color: var(--accent); }
        
        button { width: 100%; padding: 16px; border-radius: 12px; border: none; font-weight: 600; cursor: pointer; background: var(--accent); color: #0f172a; transition: 0.3s; font-size: 1rem; }
        button:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(56, 189, 248, 0.4); }

        #result-area { display: none; margin-top: 30px; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .progress-wrapper { background: #334155; height: 10px; border-radius: 10px; overflow: hidden; margin: 15px 0; }
        .progress-bar { width: 0%; height: 100%; background: var(--accent); transition: 0.3s; }

        .table-container { max-height: 250px; overflow-y: auto; border: 1px solid var(--border); border-radius: 12px; margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        th, td { padding: 12px; border-bottom: 1px solid var(--border); text-align: left; }
        th { background: #1e293b; color: #94a3b8; position: sticky; top: 0; }

        #download-btn { display: none; text-align: center; margin-top: 20px; background: #22c55e; color: white; padding: 15px; border-radius: 12px; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Pro CSV Splitter</h1>
        <div class="author-chip">Created by: ABC</div>
    </div>

    <div class="drop-zone" onclick="document.getElementById('fileInput').click()">
        <p id="drop-text" style="margin:0; font-weight:500;">Drag & Drop CSV file or Click to Browse</p>
        <input type="file" id="fileInput" accept=".csv" style="display:none" onchange="analyze()">
    </div>

    <div id="statsGrid" class="stats-grid">
        <div class="stat-card"><label>Total Rows</label><span id="total-rows">0</span></div>
        <div class="stat-card"><label>File Size</label><span id="file-size">0 MB</span></div>
    </div>

    <div class="controls">
        <div>
            <label style="font-size:0.75rem; color:#64748b; margin-bottom:5px; display:block;">Split Mode</label>
            <select id="splitMode">
                <option value="rows">By Rows Per File</option>
                <option value="parts">By Total Parts</option>
            </select>
        </div>
        <div>
            <label style="font-size:0.75rem; color:#64748b; margin-bottom:5px; display:block;">Value</label>
            <input type="number" id="splitValue" value="5">
        </div>
    </div>

    <button onclick="startSplitting()">🚀 Start Splitting</button>

    <div id="result-area">
        <div style="display:flex; justify-content:space-between; font-size:0.8rem; margin-bottom:5px;">
            <span id="status-msg">Processing...</span>
            <span id="percent-msg">0%</span>
        </div>
        <div class="progress-wrapper"><div id="progressBar" class="progress-bar"></div></div>
        
        <div class="table-container">
            <table>
                <thead><tr><th>Part Name</th><th>Rows Count</th><th>Status</th></tr></thead>
                <tbody id="logBody"></tbody>
            </table>
        </div>
        
        <a id="download-btn">📥 DOWNLOAD ALL PARTS (ZIP)</a>
    </div>
</div>

<script>
    let activeFile = null;
    let totalLines = 0;

    // First Step: Fast Analyze
    function analyze() {
        activeFile = document.getElementById('fileInput').files[0];
        if(!activeFile) return;

        document.getElementById('drop-text').innerText = activeFile.name;
        document.getElementById('file-size').innerText = (activeFile.size / (1024 * 1024)).toFixed(2) + " MB";
        
        let count = 0;
        Papa.parse(activeFile, {
            worker: true,
            step: () => { count++; },
            complete: () => {
                totalLines = count - 1; // Header minus
                document.getElementById('total-rows').innerText = totalLines.toLocaleString();
                document.getElementById('statsGrid').style.display = 'grid';
            }
        });
    }

    // Second Step: Actual Splitting
    async function startSplitting() {
        if(!activeFile) return alert("Please select a file first!");
        
        const mode = document.getElementById('splitMode').value;
        const val = parseInt(document.getElementById('splitValue').value);
        
        // Exact Logic: Calculated Once
        let targetRowsPerPart = mode === 'rows' ? val : Math.ceil(totalLines / val);

        document.getElementById('result-area').style.display = 'block';
        document.getElementById('logBody').innerHTML = "";
        document.getElementById('download-btn').style.display = 'none';

        const zip = new JSZip();
        let headers = "";
        let currentChunk = [];
        let partIdx = 1;
        let processedCount = 0;

        Papa.parse(activeFile, {
            worker: true,
            header: false,
            skipEmptyLines: true,
            chunk: (results) => {
                if(!headers) {
                    headers = results.data[0].join(",") + "\n";
                    results.data.shift();
                }

                results.data.forEach(row => {
                    currentChunk.push(row.join(","));
                    processedCount++;

                    // Check if chunk is full
                    if(currentChunk.length >= targetRowsPerPart) {
                        zip.file(`Part_${partIdx}.csv`, headers + currentChunk.join("\n"));
                        addTableRow(`Part_${partIdx}.csv`, currentChunk.length);
                        currentChunk = [];
                        partIdx++;
                    }

                    // Progress Update
                    if(processedCount % 5000 === 0) {
                        let p = Math.round((processedCount / totalLines) * 100);
                        document.getElementById('progressBar').style.width = p + "%";
                        document.getElementById('percent-msg').innerText = p + "%";
                    }
                });
            },
            complete: async () => {
                // Add remaining rows to the very last part
                if(currentChunk.length > 0) {
                    zip.file(`Part_${partIdx}.csv`, headers + currentChunk.join("\n"));
                    addTableRow(`Part_${partIdx}.csv`, currentChunk.length);
                }

                document.getElementById('status-msg').innerText = "Generating ZIP...";
                const zipContent = await zip.generateAsync({type:"blob"});
                const dl = document.getElementById('download-btn');
                dl.href = URL.createObjectURL(zipContent);
                dl.download = `ABC_Split_${activeFile.name.replace('.csv', '')}.zip`;
                dl.style.display = "block";
                document.getElementById('status-msg').innerText = "Splitting Done!";
                document.getElementById('progressBar').style.width = "100%";
                document.getElementById('percent-msg').innerText = "100%";
            }
        });
    }

    function addTableRow(name, rows) {
        const body = document.getElementById('logBody');
        const row = body.insertRow();
        row.innerHTML = `<td>${name}</td><td>${rows.toLocaleString()}</td><td style="color:#22c55e; font-weight:bold;">Success</td>`;
    }
</script>

</body>
</html>
