<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro CSV Splitter - ABC</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --bg: #0f172a; --card: #1e293b; --accent: #38bdf8; --success: #22c55e; --text: #f1f5f9;
        }
        body {
            font-family: 'Poppins', sans-serif; background: var(--bg); color: var(--text);
            display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0;
        }
        .container {
            background: var(--card); padding: 40px; border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5); width: 100%; max-width: 650px; border: 1px solid rgba(255,255,255,0.1);
        }
        .header { text-align: center; margin-bottom: 30px; }
        .author-badge {
            background: rgba(56, 189, 248, 0.1); color: var(--accent);
            padding: 5px 15px; border-radius: 20px; font-family: 'JetBrains Mono'; font-size: 0.8rem;
            border: 1px solid var(--accent); display: inline-block; margin-top: 10px;
        }
        /* Stylish File Input */
        .drop-zone {
            border: 2px dashed #475569; border-radius: 16px; padding: 40px;
            text-align: center; cursor: pointer; transition: 0.3s; background: rgba(255,255,255,0.02);
            position: relative; margin-bottom: 20px;
        }
        .drop-zone:hover, .drop-zone.active { border-color: var(--accent); background: rgba(56, 189, 248, 0.05); }
        .drop-zone input { position: absolute; width: 100%; height: 100%; top: 0; left: 0; opacity: 0; cursor: pointer; }
        .drop-zone p { margin: 0; font-weight: 500; }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .input-box { background: #0f172a; border: 1px solid #334155; padding: 12px; border-radius: 10px; color: white; width: 100%; box-sizing: border-box; }
        
        button {
            width: 100%; padding: 15px; border-radius: 12px; border: none; font-weight: 600;
            cursor: pointer; transition: 0.3s; font-size: 1rem;
        }
        .btn-primary { background: var(--accent); color: #0f172a; margin-top: 10px; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(56, 189, 248, 0.4); }
        
        #process-area { display: none; margin-top: 30px; padding: 20px; background: rgba(0,0,0,0.2); border-radius: 15px; }
        .progress-container { background: #334155; height: 10px; border-radius: 5px; margin: 15px 0; overflow: hidden; }
        .progress-bar { width: 0%; height: 100%; background: var(--accent); transition: 0.3s; }
        
        .final-options { display: none; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; animation: slideUp 0.5s; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .csv-dl { background: #10b981; color: white; }
        .xls-dl { background: #f59e0b; color: white; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1 style="margin:0; font-size:1.8rem;">🚀 Ultimate CSV Splitter</h1>
        <div class="author-badge">Created by: ABC</div>
    </div>

    <div class="drop-zone" id="dropZone">
        <p id="file-name">Drag & Drop CSV file or Click to Browse</p>
        <input type="file" id="csvFile" accept=".csv">
    </div>

    <div id="file-info" style="display:none; text-align:center; margin-bottom:20px; font-size:0.9rem; color:var(--accent);">
        Rows: <span id="info-rows">0</span> | Size: <span id="info-size">0 MB</span>
    </div>

    <div class="grid">
        <div>
            <label style="font-size:0.8rem; color:#94a3b8;">Split Mode</label>
            <select id="splitMode" class="input-box">
                <option value="rows">Fixed Rows (Max 10Lakh)</option>
                <option value="parts">Equal Parts</option>
            </select>
        </div>
        <div>
            <label style="font-size:0.8rem; color:#94a3b8;">Value</label>
            <input type="number" id="splitValue" class="input-box" value="999999">
        </div>
    </div>

    <button class="btn-primary" onclick="startSplitting()">Process File</button>

    <div id="process-area">
        <div id="status">Taiyar...</div>
        <div class="progress-container"><div id="progressBar" class="progress-bar"></div></div>
        
        <div id="finish-area" class="final-options">
            <button class="csv-dl" onclick="downloadAll('csv')">Download as CSV ZIP</button>
            <button class="xls-dl" onclick="downloadAll('xlsx')">Convert & Download Excel ZIP</button>
        </div>
    </div>
</div>

<script>
    let rawFile = null;
    let totalRows = 0;
    let splitChunks = [];
    let csvHeaders = "";

    const fileInput = document.getElementById('csvFile');
    const dropZone = document.getElementById('dropZone');

    fileInput.onchange = (e) => handleFile(e.target.files[0]);
    
    function handleFile(file) {
        if(!file) return;
        rawFile = file;
        document.getElementById('file-name').innerText = file.name;
        document.getElementById('info-size').innerText = (file.size / (1024*1024)).toFixed(2) + " MB";
        
        Papa.parse(file, {
            step: () => { totalRows++; },
            complete: () => {
                totalRows--; 
                document.getElementById('file-info').style.display = 'block';
                document.getElementById('info-rows').innerText = totalRows.toLocaleString();
            }
        });
    }

    async function startSplitting() {
        if(!rawFile) return alert("Pehle file select karein!");
        
        const mode = document.getElementById('splitMode').value;
        const val = parseInt(document.getElementById('splitValue').value);
        let chunkSize = mode === 'rows' ? val : Math.ceil(totalRows / val);

        document.getElementById('process-area').style.display = 'block';
        document.getElementById('finish-area').style.display = 'none';
        
        splitChunks = [];
        let buffer = [];
        let processed = 0;

        Papa.parse(rawFile, {
            header: false,
            chunk: (results) => {
                if(!csvHeaders) {
                    csvHeaders = results.data[0];
                    results.data.shift();
                }
                buffer.push(...results.data);
                processed += results.data.length;
                
                let p = (processed / totalRows) * 100;
                document.getElementById('progressBar').style.width = p + "%";
                document.getElementById('status').innerText = `Splitting: ${Math.round(p)}%`;

                while(buffer.length >= chunkSize) {
                    splitChunks.push(buffer.splice(0, chunkSize));
                }
            },
            complete: () => {
                if(buffer.length > 0) splitChunks.push(buffer);
                document.getElementById('status').innerText = "Splitting Complete! Format chunein:";
                document.getElementById('finish-area').style.display = 'grid';
            }
        });
    }

    async function downloadAll(format) {
        const zip = new JSZip();
        const status = document.getElementById('status');
        const progressBar = document.getElementById('progressBar');
        
        for(let i=0; i < splitChunks.length; i++) {
            let p = ((i+1) / splitChunks.length) * 100;
            status.innerText = `Converting Part ${i+1} to ${format.toUpperCase()}...`;
            progressBar.style.width = p + "%";

            let content;
            if(format === 'csv') {
                content = Papa.unparse({ fields: csvHeaders, data: splitChunks[i] });
            } else {
                // Excel optimization: sheet per part
                const ws = XLSX.utils.aoa_to_sheet([csvHeaders, ...splitChunks[i]]);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "Data");
                const buf = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
                content = new Blob([buf]);
            }
            zip.file(`Part_${i+1}.${format}`, content);
            
            // Allow browser to breathe
            await new Promise(r => setTimeout(r, 100));
        }

        status.innerText = "Generating ZIP... please wait.";
        const zipBlob = await zip.generateAsync({type:"blob"});
        const link = document.createElement('a');
        link.href = URL.createObjectURL(zipBlob);
        link.download = `ABC_Split_${format.toUpperCase()}.zip`;
        link.click();
        status.innerText = "Download Started!";
    }
</script>

</body>
</html>
