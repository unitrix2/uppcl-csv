<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSV & Excel Splitter for UPPCL</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --accent-cyan: #00f2fe;
            --accent-blue: #4facfe;
            --success-green: #00ff87;
            --text-main: #e2e8f0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            max-width: 750px;
            width: 100%;
        }

        .header-section {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-weight: 600;
            letter-spacing: -1px;
            margin-bottom: 5px;
            background: linear-gradient(to right, var(--accent-cyan), var(--accent-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .author-chip {
            display: inline-block;
            background: rgba(0, 242, 254, 0.1);
            border: 1px solid var(--accent-cyan);
            color: var(--accent-cyan);
            padding: 4px 16px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-family: 'JetBrains Mono', monospace;
            margin-bottom: 20px;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.2);
        }

        .upload-area {
            border: 2px dashed rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            transition: 0.3s;
            background: rgba(255, 255, 255, 0.02);
            margin-bottom: 20px;
        }

        .upload-area:hover { border-color: var(--accent-cyan); background: rgba(255, 255, 255, 0.05); }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
            display: none;
        }

        .stat-card {
            background: rgba(0, 0, 0, 0.2);
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .stat-card span { display: block; font-size: 1.2rem; font-weight: 600; color: var(--accent-cyan); }
        .stat-card label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; color: #888; }

        .control-panel {
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        label.input-label { font-size: 0.8rem; margin-bottom: 5px; display: block; color: #94a3b8; }

        input, select {
            width: 100%;
            background: #0f172a;
            border: 1px solid #334155;
            padding: 12px;
            border-radius: 10px;
            color: white;
            font-family: inherit;
            box-sizing: border-box;
        }

        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        button {
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-csv { background: #10b981; color: white; box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3); }
        .btn-excel { background: #3b82f6; color: white; box-shadow: 0 4px 14px rgba(59, 130, 246, 0.3); }

        button:hover { transform: translateY(-3px); opacity: 0.9; }

        #progress-section { margin-top: 30px; display: none; }

        .progress-wrapper {
            background: #0f172a;
            height: 12px;
            border-radius: 10px;
            overflow: hidden;
            margin: 15px 0;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-blue));
            box-shadow: 0 0 15px var(--accent-cyan);
            transition: 0.3s;
        }

        .table-container {
            max-height: 200px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            margin-top: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }

        th { background: rgba(255, 255, 255, 0.05); padding: 12px; text-align: left; color: #94a3b8; }
        td { padding: 12px; border-top: 1px solid rgba(255, 255, 255, 0.05); }

        .download-link {
            display: none;
            text-align: center;
            margin-top: 20px;
            background: var(--success-green);
            color: #064e3b;
            padding: 15px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(0, 255, 135, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(0, 255, 135, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 255, 135, 0); }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-section">
        <h1>CSV Splitter for UPPCL</h1>
        <div class="author-chip">Created by: Salman</div>
    </div>

    <div class="upload-area">
        <label class="input-label">Badi CSV file yahan select karein</label>
        <input type="file" id="csvInput" accept=".csv" onchange="handleFile()">
    </div>

    <div id="statsArea" class="stats-grid">
        <div class="stat-card"><label>Total Rows</label><span id="rowDisplay">0</span></div>
        <div class="stat-card"><label>File Size</label><span id="sizeDisplay">0 MB</span></div>
    </div>

    <div class="control-panel">
        <div>
            <label class="input-label">Split Mode</label>
            <select id="modeSelect">
                <option value="rows">Fixed Rows (Excel Limit: 999k)</option>
                <option value="parts">Equal Parts (Barabar Hisson mein)</option>
            </select>
        </div>
        <div>
            <label class="input-label">Value</label>
            <input type="number" id="splitValue" value="999999">
        </div>
    </div>

    <div class="btn-group">
        <button class="btn-csv" onclick="startProcess('csv')">⚡ Split to CSV</button>
        <button class="btn-excel" onclick="startProcess('xlsx')">📊 Split to Excel</button>
    </div>

    <div id="progress-section">
        <div style="display: flex; justify-content: space-between; font-size: 0.8rem;">
            <span id="statusTxt">Taiyar ho raha hai...</span>
            <span id="percentTxt">0%</span>
        </div>
        <div class="progress-wrapper"><div id="mainBar" class="progress-bar"></div></div>
        
        <div class="table-container">
            <table id="logTable">
                <thead><tr><th>Part Name</th><th>Rows Count</th><th>Format</th></tr></thead>
                <tbody id="logBody"></tbody>
            </table>
        </div>

        <a id="finalDownload" class="download-link">📥 DOWNLOAD ALL PARTS (ZIP)</a>
    </div>
</div>

<script>
    let activeFile = null;
    let totalRowsCount = 0;

    async function handleFile() {
        activeFile = document.getElementById('csvInput').files[0];
        if(!activeFile) return;

        document.getElementById('statsArea').style.display = 'grid';
        document.getElementById('sizeDisplay').innerText = (activeFile.size / (1024 * 1024)).toFixed(2) + " MB";
        
        Papa.parse(activeFile, {
            step: () => { totalRowsCount++; },
            complete: () => {
                totalRowsCount--; // Header row
                document.getElementById('rowDisplay').innerText = totalRowsCount.toLocaleString();
            }
        });
    }

    async function startProcess(fmt) {
        if(!activeFile) return alert("Pehle file select karein!");
        
        const mode = document.getElementById('modeSelect').value;
        const val = parseInt(document.getElementById('splitValue').value);
        const zip = new JSZip();
        
        document.getElementById('progress-section').style.display = 'block';
        document.getElementById('logBody').innerHTML = "";
        document.getElementById('finalDownload').style.display = 'none';

        let chunkSize = mode === 'rows' ? val : Math.ceil(totalRowsCount / val);
        let headerData = null;
        let buffer = [];
        let fileIndex = 0;
        let processedTotal = 0;

        Papa.parse(activeFile, {
            header: false,
            chunk: async (results, parser) => {
                parser.pause();
                
                if(!headerData) {
                    headerData = results.data[0];
                    results.data.shift();
                }

                buffer.push(...results.data);
                processedTotal += results.data.length;

                // UI Update
                let p = Math.round((processedTotal / totalRowsCount) * 100);
                document.getElementById('mainBar').style.width = p + "%";
                document.getElementById('percentTxt').innerText = p + "%";
                document.getElementById('statusTxt').innerText = `Part ${fileIndex+1} process ho raha hai...`;

                while(buffer.length >= chunkSize) {
                    fileIndex++;
                    await createPart(zip, buffer.splice(0, chunkSize), headerData, fileIndex, fmt);
                }
                parser.resume();
            },
            complete: async () => {
                if(buffer.length > 0) {
                    fileIndex++;
                    await createPart(zip, buffer, headerData, fileIndex, fmt);
                }
                
                document.getElementById('statusTxt').innerText = "ZIP generate ho rahi hai...";
                const content = await zip.generateAsync({type:"blob"});
                const dl = document.getElementById('finalDownload');
                dl.href = URL.createObjectURL(content);
                dl.download = `ABC_Splitter_${activeFile.name.split('.')[0]}.zip`;
                dl.style.display = 'block';
                document.getElementById('statusTxt').innerText = "Kaam Pura Ho Gaya!";
            }
        });
    }

    async function createPart(zip, data, head, idx, fmt) {
        const name = `Part_${idx}.${fmt}`;
        let blob;

        if(fmt === 'csv') {
            blob = Papa.unparse({ fields: head, data: data });
        } else {
            const ws = XLSX.utils.aoa_to_sheet([head, ...data]);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Sheet1");
            const buf = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
            blob = new Blob([buf]);
        }

        zip.file(name, blob);
        const row = document.getElementById('logBody').insertRow();
        row.innerHTML = `<td>${name}</td><td>${data.length.toLocaleString()}</td><td>${fmt.toUpperCase()}</td>`;
    }
</script>

</body>
</html>
