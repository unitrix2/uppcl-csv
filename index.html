<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro CSV Splitter - ABC</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --accent: #38bdf8; --text: #f1f5f9; --border: #334155; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg); color: var(--text); display: flex; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; }
        .container { background: var(--card); padding: 35px; border-radius: 20px; box-shadow: 0 15px 40px rgba(0,0,0,0.4); width: 100%; max-width: 700px; border: 1px solid var(--border); }
        .header { text-align: center; margin-bottom: 25px; }
        h1 { margin: 0; font-size: 1.8rem; color: var(--accent); }
        .author-chip { display: inline-block; background: rgba(56, 189, 248, 0.1); border: 1px solid var(--accent); color: var(--accent); padding: 4px 12px; border-radius: 50px; font-family: 'JetBrains Mono'; font-size: 0.75rem; margin-top: 8px; }
        
        .drop-zone { border: 2px dashed #475569; border-radius: 12px; padding: 35px; text-align: center; cursor: pointer; transition: 0.2s; background: rgba(255,255,255,0.02); margin-bottom: 20px; }
        .drop-zone:hover { border-color: var(--accent); }
        
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; display: none; }
        .stat-card { background: #0f172a; padding: 12px; border-radius: 10px; border: 1px solid var(--border); text-align: center; }
        .stat-card label { display: block; font-size: 0.65rem; color: #64748b; text-transform: uppercase; }
        .stat-card span { font-size: 1rem; font-weight: 600; color: var(--accent); }

        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        select, input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: #0f172a; color: white; outline: none; }
        
        button { width: 100%; padding: 14px; border-radius: 10px; border: none; font-weight: 600; cursor: pointer; background: var(--accent); color: #0f172a; transition: 0.2s; }
        button:hover { opacity: 0.9; }

        #result-area { display: none; margin-top: 25px; }
        .progress-container { background: #334155; height: 8px; border-radius: 10px; overflow: hidden; margin: 12px 0; }
        .progress-bar { width: 0%; height: 100%; background: var(--accent); transition: 0.1s; }
        
        .table-wrap { max-height: 250px; overflow-y: auto; border: 1px solid var(--border); border-radius: 10px; margin-top: 15px; }
        table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
        th, td { padding: 10px; border-bottom: 1px solid var(--border); text-align: left; }
        th { background: #1e293b; position: sticky; top: 0; color: #94a3b8; }

        #download-link { display: none; text-align: center; margin-top: 15px; background: #22c55e; color: white; padding: 12px; border-radius: 10px; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Pro CSV Splitter</h1>
        <div class="author-chip">Created by: ABC</div>
    </div>

    <div class="drop-zone" onclick="document.getElementById('fileInput').click()">
        <p id="drop-text">Browse or Drag CSV File</p>
        <input type="file" id="fileInput" accept=".csv" style="display:none" onchange="analyze()">
    </div>

    <div id="statsGrid" class="stats-grid">
        <div class="stat-card"><label>Total Rows</label><span id="total-rows">0</span></div>
        <div class="stat-card"><label>Size</label><span id="file-size">0 MB</span></div>
    </div>

    <div class="controls">
        <div>
            <select id="splitMode">
                <option value="rows">Rows Per File</option>
                <option value="parts">Total Parts (Fixed)</option>
            </select>
        </div>
        <div>
            <input type="number" id="splitValue" value="5">
        </div>
    </div>

    <button onclick="process()">Start Splitting</button>

    <div id="result-area">
        <div style="display:flex; justify-content:space-between; font-size:0.75rem">
            <span id="status">Taiyar...</span>
            <span id="percent">0%</span>
        </div>
        <div class="progress-container"><div id="bar" class="progress-bar"></div></div>
        
        <div class="table-wrap">
            <table>
                <thead><tr><th>Part Name</th><th>Rows</th><th>Status</th></tr></thead>
                <tbody id="logBody"></tbody>
            </table>
        </div>
        <a id="download-link">📥 DOWNLOAD ZIP</a>
    </div>
</div>

<script>
    let activeFile = null;
    let totalLineCount = 0;

    function analyze() {
        activeFile = document.getElementById('fileInput').files[0];
        if(!activeFile) return;
        document.getElementById('drop-text').innerText = activeFile.name;
        document.getElementById('file-size').innerText = (activeFile.size/(1024*1024)).toFixed(2) + " MB";
        
        let count = 0;
        Papa.parse(activeFile, {
            worker: true,
            step: () => { count++; },
            complete: () => {
                totalLineCount = count - 1;
                document.getElementById('total-rows').innerText = totalLineCount.toLocaleString();
                document.getElementById('statsGrid').style.display = 'grid';
            }
        });
    }

    async function process() {
        if(!activeFile) return alert("File chunein!");
        const mode = document.getElementById('splitMode').value;
        const val = parseInt(document.getElementById('splitValue').value);
        
        // Exact Calculation
        let chunkSize = (mode === 'parts') ? Math.ceil(totalLineCount / val) : val;
        
        document.getElementById('result-area').style.display = 'block';
        document.getElementById('logBody').innerHTML = "";
        document.getElementById('download-link').style.display = 'none';

        const zip = new JSZip();
        let headers = "";
        let currentBuffer = [];
        let partNum = 1;
        let processed = 0;

        Papa.parse(activeFile, {
            worker: true,
            chunkSize: 1024 * 1024 * 2, // 2MB chunks for stability
            chunk: (results) => {
                if(!headers) {
                    headers = results.data[0].join(",") + "\n";
                    results.data.shift();
                }

                for(let i=0; i<results.data.length; i++) {
                    let row = results.data[i];
                    if(row.length > 0 && row[0] !== "") {
                        currentBuffer.push(row.join(","));
                        processed++;

                        // Stop exactly when chunkSize reached (unless it's the last part of requested parts)
                        if(currentBuffer.length >= chunkSize && (mode === 'rows' || partNum < val)) {
                            zip.file(`Part_${partNum}.csv`, headers + currentBuffer.join("\n"));
                            addLog(`Part_${partNum}.csv`, currentBuffer.length);
                            currentBuffer = [];
                            partNum++;
                        }
                    }
                }
                let p = Math.round((processed/totalLineCount)*100);
                document.getElementById('bar').style.width = p + "%";
                document.getElementById('percent').innerText = p + "%";
                document.getElementById('status').innerText = `Processing Part ${partNum}...`;
            },
            complete: async () => {
                // Add remaining data to the last part
                if(currentBuffer.length > 0) {
                    zip.file(`Part_${partNum}.csv`, headers + currentBuffer.join("\n"));
                    addLog(`Part_${partNum}.csv`, currentBuffer.length);
                }

                document.getElementById('status').innerText = "Zipping...";
                const blob = await zip.generateAsync({type:"blob"});
                const link = document.getElementById('download-link');
                link.href = URL.createObjectURL(blob);
                link.download = `ABC_Split_${activeFile.name.replace('.csv','')}.zip`;
                link.style.display = "block";
                document.getElementById('status').innerText = "Complete!";
            }
        });
    }

    function addLog(n, r) {
        const row = document.getElementById('logBody').insertRow();
        row.innerHTML = `<td>${n}</td><td>${r.toLocaleString()}</td><td style="color:#22c55e">✓</td>`;
    }
</script>

</body>
</html>
