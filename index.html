<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSV Splitter Pro - ABC</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root {
            --bg: #0f172a; --card: #1e293b; --accent: #38bdf8; --text: #f1f5f9; --border: #334155;
        }
        body {
            font-family: 'Poppins', sans-serif; background: var(--bg); color: var(--text);
            display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px;
        }
        .container {
            background: var(--card); padding: 40px; border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5); width: 100%; max-width: 700px; border: 1px solid var(--border);
        }
        .header { text-align: center; margin-bottom: 30px; }
        h1 { margin: 0; font-size: 2rem; background: linear-gradient(90deg, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .author-chip {
            display: inline-block; background: rgba(56, 189, 248, 0.1); border: 1px solid var(--accent);
            color: var(--accent); padding: 5px 15px; border-radius: 50px; font-family: 'JetBrains Mono';
            font-size: 0.8rem; margin-top: 10px; box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
        }

        .drop-zone {
            border: 2px dashed #475569; border-radius: 16px; padding: 40px;
            text-align: center; cursor: pointer; transition: 0.3s; background: rgba(255,255,255,0.02);
            margin-bottom: 25px;
        }
        .drop-zone:hover { border-color: var(--accent); background: rgba(56, 189, 248, 0.05); }
        
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; display: none; }
        .stat-card { background: #0f172a; padding: 15px; border-radius: 12px; border: 1px solid var(--border); text-align: center; }
        .stat-card label { display: block; font-size: 0.7rem; color: #64748b; text-transform: uppercase; margin-bottom: 5px; }
        .stat-card span { font-size: 1.1rem; font-weight: 600; color: var(--accent); }

        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px; }
        select, input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: #0f172a; color: white; box-sizing: border-box; }
        
        button {
            width: 100%; padding: 16px; border-radius: 12px; border: none; font-weight: 600;
            cursor: pointer; background: var(--accent); color: #0f172a; transition: 0.3s; font-size: 1rem;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(56, 189, 248, 0.4); }

        #result-area { display: none; margin-top: 30px; }
        .progress-container { background: #334155; height: 10px; border-radius: 10px; overflow: hidden; margin: 15px 0; }
        .progress-bar { width: 0%; height: 100%; background: var(--accent); transition: 0.3s; }

        .details-table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 0.85rem; }
        th, td { padding: 12px; border: 1px solid var(--border); text-align: left; }
        th { background: #1e293b; color: #94a3b8; }

        #download-btn {
            display: none; text-align: center; margin-top: 20px; background: #22c55e; color: white;
            padding: 15px; border-radius: 12px; text-decoration: none; font-weight: bold;
            box-shadow: 0 4px 14px rgba(34, 197, 94, 0.3);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Pro CSV Splitter</h1>
        <div class="author-chip">Created by: ABC</div>
    </div>

    <div class="drop-zone" onclick="document.getElementById('fileInput').click()">
        <p id="drop-text">Drag & Drop CSV file or Click to Browse</p>
        <input type="file" id="fileInput" accept=".csv" style="display:none" onchange="analyze()">
    </div>

    <div id="statsGrid" class="stats-grid">
        <div class="stat-card"><label>Total Rows</label><span id="total-rows">0</span></div>
        <div class="stat-card"><label>File Size</label><span id="file-size">0 MB</span></div>
    </div>

    <div class="controls">
        <div>
            <label style="font-size:0.75rem; color:#64748b; margin-bottom:5px; display:block;">Mode</label>
            <select id="splitMode">
                <option value="rows">Rows Per File</option>
                <option value="parts">Equal Parts</option>
            </select>
        </div>
        <div>
            <label style="font-size:0.75rem; color:#64748b; margin-bottom:5px; display:block;">Value</label>
            <input type="number" id="splitValue" value="999999">
        </div>
    </div>

    <button onclick="startSplit()">Start Processing</button>

    <div id="result-area">
        <div id="status">Taiyar...</div>
        <div class="progress-container"><div id="bar" class="progress-bar"></div></div>
        
        <div style="max-height: 200px; overflow-y: auto; border: 1px solid var(--border); border-radius: 10px;">
            <table class="details-table">
                <thead><tr><th>Output Part</th><th>Rows Count</th><th>Status</th></tr></thead>
                <tbody id="logBody"></tbody>
            </table>
        </div>
        
        <a id="download-btn">📥 DOWNLOAD ZIP FILE</a>
    </div>
</div>

<script>
    let csvFile = null;
    let totalLines = 0;

    function analyze() {
        csvFile = document.getElementById('fileInput').files[0];
        if(!csvFile) return;

        document.getElementById('drop-text').innerText = csvFile.name;
        document.getElementById('file-size').innerText = (csvFile.size / (1024 * 1024)).toFixed(2) + " MB";
        
        // Simple Fast Counting
        Papa.parse(csvFile, {
            step: () => { totalLines++; },
            complete: () => {
                totalLines--; // Remove header count
                document.getElementById('total-rows').innerText = totalLines.toLocaleString();
                document.getElementById('statsGrid').style.display = 'grid';
            }
        });
    }

    async function startSplit() {
        if(!csvFile) return alert("Pehle file chunein!");
        
        const mode = document.getElementById('splitMode').value;
        const val = parseInt(document.getElementById('splitValue').value);
        const chunkSize = mode === 'rows' ? val : Math.ceil(totalLines / val);

        document.getElementById('result-area').style.display = 'block';
        document.getElementById('logBody').innerHTML = "";
        document.getElementById('download-btn').style.display = 'none';

        const zip = new JSZip();
        let headers = "";
        let currentChunk = [];
        let partIdx = 1;
        let processed = 0;

        Papa.parse(csvFile, {
            chunk: (results) => {
                if(!headers) {
                    headers = results.data[0].join(",") + "\n";
                    results.data.shift();
                }

                results.data.forEach(row => {
                    if(row.length > 1 || row[0] !== "") {
                        currentChunk.push(row.join(","));
                        processed++;

                        if(currentChunk.length >= chunkSize) {
                            const content = headers + currentChunk.join("\n");
                            zip.file(`Part_${partIdx}.csv`, content);
                            addTableRow(`Part_${partIdx}.csv`, currentChunk.length);
                            currentChunk = [];
                            partIdx++;
                        }
                    }
                });

                let p = Math.round((processed / totalLines) * 100);
                document.getElementById('bar').style.width = p + "%";
                document.getElementById('status').innerText = `Processing: ${p}%`;
            },
            complete: async () => {
                if(currentChunk.length > 0) {
                    zip.file(`Part_${partIdx}.csv`, headers + currentChunk.join("\n"));
                    addTableRow(`Part_${partIdx}.csv`, currentChunk.length);
                }

                document.getElementById('status').innerText = "Finalizing ZIP...";
                const zipBlob = await zip.generateAsync({type:"blob"});
                const btn = document.getElementById('download-btn');
                btn.href = URL.createObjectURL(zipBlob);
                btn.download = `ABC_Split_${csvFile.name.replace('.csv', '')}.zip`;
                btn.style.display = "block";
                document.getElementById('status').innerText = "Process Complete!";
            }
        });
    }

    function addTableRow(name, rows) {
        const body = document.getElementById('logBody');
        const row = body.insertRow();
        row.innerHTML = `<td>${name}</td><td>${rows.toLocaleString()}</td><td style="color:#22c55e">OK</td>`;
    }
</script>

</body>
</html>
